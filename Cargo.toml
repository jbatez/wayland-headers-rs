[workspace]
resolver = "3"
members = [
    "wayland-headers",
    "wayland-headers-generator",
    "wayland-protocol",
]

[workspace.package]
version = "0.1.1+wayland-1.18.0-protocols-1.20"
repository = "https://github.com/jbatez/wayland-headers-rs"
keywords = [
    "wayland",
    "headers",
    "bindings",
]
categories = [
    "api-bindings",
    "gui",
]

[workspace.dependencies]
wayland-protocol = { path = "wayland-protocol", version = "0.1.1" }
